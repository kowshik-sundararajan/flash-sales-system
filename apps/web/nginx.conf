# Rate limit: 100 req/s per client address (burst 200), then 429.
# For demo purposes, the stress test skips it via the header below.
map $http_x_load_test $limit_key {
  default $binary_remote_addr;
  "stress-test" "";
}
# Behind another proxy/load balancer all users share its address. Trust only
# that proxy and read the real address from it, e.g.:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header X-Forwarded-For;
limit_req_zone $limit_key zone=api:10m rate=100r/s;
limit_req_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;

  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    limit_req zone=api burst=200 nodelay;
    error_page 429 = @too_many_requests;

    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_503;
    proxy_next_upstream_tries 2;
  }

  location @too_many_requests {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"too_many_requests"}';
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}