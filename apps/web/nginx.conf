# Anyone can send as many requests as they like, so each client address gets
# 100 requests a second (bursts of 200), then nginx answers 429. That is far above
# what a person or a busy office behind one address sends, and far below a flood.
# The stress test sends the header below to skip the limit, because it is one
# address sending thousands of requests a second on purpose. This bypass is for
# the demo only: anyone can send that header.
map $http_x_load_test $limit_key {
  default $binary_remote_addr;
  "stress-test" "";
}
#
# The address is the one that connects to nginx. If another proxy or load
# balancer sits in front of nginx, every user would share its address and one
# bucket. Then trust only that proxy and read the real address from it, e.g.:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header X-Forwarded-For;
# Never trust the header from everyone: anyone could forge a new address per request.
limit_req_zone $limit_key zone=api:10m rate=100r/s;
limit_req_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;

  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    limit_req zone=api burst=200 nodelay;
    error_page 429 = @too_many_requests;

    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    # Try another replica on a connect error, a timeout or a 503. nginx never
    # retries a POST this way, so a purchase is not repeated behind the user's back.
    proxy_next_upstream error timeout http_503;
    proxy_next_upstream_tries 2;
  }

  location @too_many_requests {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"too_many_requests"}';
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}